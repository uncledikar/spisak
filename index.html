<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spisak/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2d6a4f" />
    <meta name="description" content="SmartLife — to-do and shopping lists, personal finance tracking, and medicine in one place" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SmartLife" />
    <link rel="manifest" href="/spisak/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/spisak/icons/icon-192.png" />
    <title>SmartLife</title>
    <style>
      /* Instant shell before JS — avoids blank white screen on cold start */
      html, body, #root { min-height: 100%; margin: 0; }
      body {
        font-family: 'Segoe UI', 'SF Pro Text', 'Roboto', 'Helvetica Neue', sans-serif;
        background: #f3f5f2;
        color: #1a211c;
      }
      #root:empty::before {
        content: 'SmartLife';
        display: grid;
        place-items: center;
        min-height: 100dvh;
        font-weight: 750;
        letter-spacing: -0.02em;
        font-size: 1.25rem;
        opacity: 0.55;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121512; color: #e8ebe9; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
